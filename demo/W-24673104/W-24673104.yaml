openapi: 3.0.0
info:
  title: W-24673104 nullable scalar description
  version: 1.0.0
paths:
  /things:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Things'
      responses:
        '200':
          description: ok
components:
  schemas:
    Things:
      type: object
      properties:
        refNullable:
          type: array
          items:
            $ref: '#/components/schemas/NullableItem'
        refPlain:
          type: array
          items:
            $ref: '#/components/schemas/PlainItem'
        inlineNullable:
          type: array
          items:
            type: object
            properties:
              uniqueId:
                type: string
                nullable: true
                description: Unique identifier
              amount:
                type: number
                format: double
                nullable: true
                description: Amount in USD
        inlinePlain:
          type: array
          items:
            type: object
            properties:
              uniqueId:
                type: string
                description: Unique identifier
              amount:
                type: number
                format: double
                description: Amount in USD
    NullableItem:
      type: object
      properties:
        uniqueId:
          type: string
          nullable: true
          description: Unique identifier
        amount:
          type: number
          format: double
          nullable: true
          description: Amount in USD
    PlainItem:
      type: object
      properties:
        uniqueId:
          type: string
          description: Unique identifier
        amount:
          type: number
          format: double
          description: Amount in USD
